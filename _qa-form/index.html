<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CashAsIs isolated form QA</title><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; frame-src 'self' file:; connect-src 'none'; form-action 'none'"><style>body{margin:0;background:#e9edf3;font:15px system-ui;color:#172435}header{padding:14px 20px;background:#172435;color:#fff}h1{font-size:20px;margin:0 0 6px}.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 20px}button,select{font:inherit;padding:8px 12px}#counts{padding:0 20px 12px;font-family:monospace}iframe{display:block;margin:0 auto;width:1100px;max-width:100%;height:1050px;border:1px solid #c0cad9;background:white}.note{font-size:13px;margin:0;color:#dbe8f9}</style></head><body><header><h1>CashAsIs isolated visual QA</h1><p class="note">Isolated preview · actual form controller/layout · mock GHL/analytics · CSP blocks all external connections</p></header><div class="controls"><label>Scenario <select id="scenario"><option value="normal">Normal</option><option value="slow">Slow: manual release</option><option value="failure">Fail first attempt, then retry</option><option value="uncertain">Uncertain outcome: no success</option><option value="lost">Lost response: receipt replay</option></select></label><button id="reload">Reset scenario</button><button id="desktop">Desktop 1100px</button><button id="mobile">Mobile 390px</button><button id="release">Release pending request</button></div><div id="counts" role="status">Waiting for fixture</div><iframe id="preview" title="CashAsIs form preview" src="offer-qa.html?scenario=normal"></iframe><script>
const frame=document.querySelector('#preview');function reset(){frame.src='offer-qa.html?scenario='+document.querySelector('#scenario').value+'&run='+Date.now();}document.querySelector('#scenario').onchange=reset;document.querySelector('#reload').onclick=reset;document.querySelector('#desktop').onclick=()=>{frame.style.width='1100px';frame.style.height='1000px';};document.querySelector('#mobile').onclick=()=>{frame.style.width='390px';frame.style.height='844px';};document.querySelector('#release').onclick=()=>frame.contentWindow.postMessage({type:'cashasis-qa-release'},'*');window.addEventListener('message',event=>{if(event.source===frame.contentWindow&&event.data&&event.data.type==='cashasis-qa')document.querySelector('#counts').textContent=JSON.stringify(event.data.counts);});
</script></body></html>
