<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Protected Lead Test</title><style>body{font-family:system-ui;max-width:620px;margin:40px auto;padding:0 20px}input,button{display:block;width:100%;padding:12px;margin:10px 0;box-sizing:border-box}#result{white-space:pre-wrap;background:#f4f4f4;padding:12px;border-radius:8px}</style></head><body><h1>Protected Lead Test</h1><p>This page tests the Netlify-protected route only. The live CashAsIs form is still using the original GHL path.</p><form id="f"><input name="full_name" placeholder="Name" value="Jack Test" required><input name="phone" placeholder="Phone" value="7135551212" required><input name="email" placeholder="Email" value="jack@gmail.com" required><input name="address1" placeholder="Property address" value="123 Main St, Houston, TX 77002" required><input name="_website" autocomplete="off" tabindex="-1" style="position:absolute;left:-9999px"><button>Send protected test</button></form><pre id="result"></pre><script>document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const fd=new FormData(e.target);const body=Object.fromEntries(fd.entries());body.source='cashasis-protected-test';body.lead_source='cashasis-protected-test';body.page='protected-test';body.stage='contact';body.tcpa_consent=true;body.submitted_at=new Date().toISOString();const out=document.getElementById('result');out.textContent='Sending...';try{const r=await fetch('/.netlify/functions/lead-submit',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});out.textContent='HTTP '+r.status+'\n'+await r.text();}catch(err){out.textContent='ERROR: '+err.message;}});</script></body></html>
