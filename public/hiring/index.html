<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Hiring | CashAsIs</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
body{margin:0;font:14px Arial;background:#f4f6f9;color:#0D1B2A}header{background:#0D1B2A;color:white;padding:18px}.head,main{max-width:1100px;margin:auto}.brand{font-size:24px;font-weight:800}.brand b{color:#F26D21}.login,.card,.list{background:white;border:1px solid #e2e6eb;border-radius:14px}.login{max-width:420px;margin:70px auto;padding:28px}.login input,textarea,select{width:100%;padding:11px;border:1px solid #dce1e7;border-radius:8px;margin:6px 0 12px;box-sizing:border-box}.btn{background:#F26D21;color:white;border:0;border-radius:8px;padding:11px 14px;font-weight:700;cursor:pointer}.link{border:0;background:none;color:#F26D21;font-weight:700;cursor:pointer}main{padding:28px 18px}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.card{padding:14px;min-width:130px}.card b{font-size:24px;display:block}.row{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:12px;padding:14px 16px;border-bottom:1px solid #e8ebef;cursor:pointer}.row:hover{background:#fafbfc}.hdr{font-size:11px;color:#687482;text-transform:uppercase;font-weight:700;cursor:default}.pill{background:#eef1f4;border-radius:99px;padding:5px 8px;font-size:11px}.ready{background:#e7f6ed;color:#187444}.muted{color:#687482;font-size:12px}.modal{display:none;position:fixed;inset:0;background:#07111dcc;padding:25px;overflow:auto}.modal.on{display:block}.panel{max-width:900px;margin:auto;background:white;border-radius:14px;padding:25px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.box{border:1px solid #e2e6eb;border-radius:10px;padding:14px;margin-top:14px}.barrow{display:grid;grid-template-columns:140px 1fr 35px;gap:7px;align-items:center;margin:7px 0;font-size:12px}.bar{height:8px;background:#eee;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#F26D21}.qa{border-bottom:1px solid #eee;padding:9px 0}.qa p{margin:4px 0}.top{display:flex;justify-content:space-between;align-items:center}.close{float:right;border:0;background:#eee;border-radius:50%;width:32px;height:32px}@media(max-width:700px){.row{grid-template-columns:1.4fr 1fr 1fr}.row>:last-child{display:none}.grid{grid-template-columns:1fr}}</style></head>
<body><header><div class="head top"><div class="brand">cash<b>asis</b> <small>HIRING</small></div><button id="out" class="link" style="display:none;color:white">Sign Out</button></div></header>
<div id="login" class="login"><h1>Hiring Dashboard</h1><p>Private hiring administration.</p><input id="email" value="www.mrwrightproperties@gmail.com" readonly><input id="pw" type="password" placeholder="Password"><button id="in" class="btn">Sign In</button><button id="up" class="link">Create login</button><p id="msg" class="muted"></p></div>
<main id="app" style="display:none"><div class="top"><div><h1>Applicants</h1><div class="muted">Application + questionnaire + Team & Position Assessment</div></div></div><div id="stats" class="stats"></div><div id="list" class="list"></div></main>
<div id="modal" class="modal"><div class="panel"><button class="close" onclick="modal.classList.remove('on')">×</button><div id="detail"></div></div></div>
<script>
const U='https://mzqzmnrmjdjzuxgrdzcd.supabase.co',K='sb_publishable_Ymc7IT9-6ZifGj-fnsCJ6A_Zqj6FryH',A=U+'/functions/v1/hiring-admin',E='www.mrwrightproperties@gmail.com',S=supabase.createClient(U,K);
const N={initiative:'Initiative & Drive',persistence:'Persistence',social:'Social Confidence',assertiveness:'Assertiveness',conscientiousness:'Follow-through',process:'Process Discipline',self_direction:'Self-Direction',adaptability:'Adaptability',composure:'Emotional Composure'};let candidates=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(q='',o={}){let x=(await S.auth.getSession()).data.session?.access_token,r=await fetch(A+q,{...o,headers:{Authorization:'Bearer '+x,apikey:K,'Content-Type':'application/json'}}),d=await r.json();if(!r.ok)throw Error(d.error);return d}
async function start(){let s=(await S.auth.getSession()).data.session;if(s?.user?.email?.toLowerCase()===E){login.style.display='none';app.style.display='block';out.style.display='block';load()}}
in.onclick=async()=>{let {error}=await S.auth.signInWithPassword({email:E,password:pw.value});msg.textContent=error?error.message:'Signed in';if(!error)location.reload()}
up.onclick=async()=>{if(pw.value.length<8)return msg.textContent='Choose a password with at least 8 characters.';let {error}=await S.auth.signUp({email:E,password:pw.value,options:{emailRedirectTo:'https://www.cashasis.com/hiring/'}});msg.textContent=error?error.message:'Check your email to confirm your account, then sign in.'}
out.onclick=async()=>{await S.auth.signOut();location.reload()}
async function load(){let d=await api();candidates=d.candidates||[];stats.innerHTML=[['Total',candidates.length],['Ready',candidates.filter(x=>x.stage==='ready_for_review').length],['Interview',candidates.filter(x=>x.stage==='interview').length],['Hired',candidates.filter(x=>x.stage==='hired').length]].map(x=>'<div class="card"><b>'+x[1]+'</b><span>'+x[0]+'</span></div>').join('');list.innerHTML='<div class="row hdr"><div>Candidate</div><div>Position</div><div>Stage</div><div>Profile</div></div>'+candidates.map(x=>'<div class="row" onclick="openC(\''+x.id+'\')"><div><b>'+esc(x.full_name)+'</b><div class="muted">'+esc(x.email)+' • '+esc(x.phone)+'</div></div><div>'+esc(x.position)+'</div><div><span class="pill '+(x.stage==='ready_for_review'?'ready':'')+'">'+x.stage.replaceAll('_',' ')+'</span></div><div>'+esc(x.profile?.profile_label||'—')+'</div></div>').join('')}
async function openC(id){modal.classList.add('on');detail.innerHTML='Loading…';let d=await api('?id='+id),c=d.candidate,p=d.profile,s=d.signals;let bars=p?Object.entries(p.scores).map(([k,v])=>'<div class="barrow"><span>'+esc(N[k]||k)+'</span><div class="bar"><i style="width:'+v+'%"></i></div><b>'+v+'</b></div>').join(''):'Not completed';let roles=s?s.role_patterns.map(x=>'<span class="pill" style="display:inline-block;margin:3px">'+esc(x.role)+' '+x.score+'</span>').join(''):'—';detail.innerHTML='<h1>'+esc(c.full_name)+'</h1><p class="muted">'+esc(c.position)+' • '+esc(c.brand)+' • '+esc(c.city||'')+', '+esc(c.state||'')+'</p><select id="stage" style="width:auto"><option value="ready_for_review">Ready for Review</option><option value="interview">Interview</option><option value="hired">Hired</option><option value="not_selected">Not Selected</option></select> <button class="btn" onclick="saveStage(\''+c.id+'\')">Update</button> '+(d.resume_url?'<a class="btn" target="_blank" href="'+d.resume_url+'" style="text-decoration:none">Resume</a>':'')+'<div class="grid"><div class="box"><h3>Team & Position Assessment</h3><b>'+esc(p?.profile_label||'Not completed')+'</b>'+bars+'</div><div class="box"><h3>Role Patterns</h3><p class="muted">Internal exploration only — not an automatic hiring decision.</p>'+roles+'<p><b>Alternate role to explore:</b> '+esc(s?.alternate_to_explore||'—')+'</p></div></div><div class="box"><h3>Application</h3><p><b>Experience:</b> '+esc(c.experience||'—')+' &nbsp; <b>Availability:</b> '+esc(c.availability||'—')+'</p><p>'+esc(c.cover_letter||'—')+'</p><p>'+esc(c.email)+' • '+esc(c.phone)+'</p></div><div class="box"><h3>Questionnaire</h3>'+d.questionnaire.map(q=>'<div class="qa"><b>'+esc(q.question_text)+'</b><p>'+esc(q.answer?.value||'')+'</p></div>').join('')+'</div><div class="box"><h3>Private Hiring Notes</h3><textarea id="notes" rows="6">'+esc(d.review?.admin_notes||'')+'</textarea><button class="btn" onclick="saveNotes(\''+c.id+'\')">Save Notes</button></div>';stage.value=['ready_for_review','interview','hired','not_selected'].includes(c.stage)?c.stage:'ready_for_review'}
async function saveStage(id){await api('',{method:'POST',body:JSON.stringify({candidate_id:id,stage:stage.value})});modal.classList.remove('on');load()}
async function saveNotes(id){await api('',{method:'POST',body:JSON.stringify({candidate_id:id,admin_notes:notes.value})});alert('Notes saved')}
start();
</script></body></html>
