<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Team & Position Assessment | CashAsIs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0D1B2A;--orange:#F26D21;--muted:#5a6675;--line:#e6e9ef;--bg:#f4f6f9}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--navy)}
header{background:var(--navy);color:#fff;padding:14px 24px}.nav{max-width:760px;margin:auto}.brand{display:inline-flex;flex-direction:column;line-height:1;text-decoration:none;color:#fff}.brand .wm{font-weight:800;font-size:22px;letter-spacing:-.03em}.brand b{color:var(--orange);font-weight:800}.brand .sub{font-size:9px;letter-spacing:.18em;color:rgba(255,255,255,.6);font-weight:700;margin-top:4px}
.hero{background:var(--navy);color:#fff;text-align:center;padding:36px 20px 64px}.hero small{color:var(--orange);font-weight:800;letter-spacing:.14em;text-transform:uppercase}.hero h1{font-size:34px;margin:12px 0 10px}.hero p{max-width:620px;margin:auto;color:#dce3eb;line-height:1.5}
.wrap{max-width:760px;margin:-30px auto 48px;padding:0 16px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 18px 50px -20px rgba(13,27,42,.35)}
.progress{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:8px}.track{height:8px;background:#eef1f5;border-radius:99px;overflow:hidden;margin-bottom:18px}.track span{display:block;height:100%;background:var(--orange)}
.note{background:#fbf4ee;border:1px solid #f1d8c7;border-radius:10px;padding:12px 14px;color:#596573;font-size:13px;line-height:1.45;margin-bottom:16px}
h2{font-size:20px;line-height:1.35;margin:0 0 8px}.hint{color:var(--muted);margin:0 0 14px;font-size:14px}
.choice{width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:14px 14px;margin:0 0 10px;font:inherit;font-size:16px;line-height:1.4;cursor:pointer;min-height:52px}
.choice:hover,.choice.on{border-color:var(--orange);background:#fff8f3}
.choice.picked{border-color:var(--navy);background:#f4f6f9}
.nav{display:flex;gap:10px;margin-top:8px}.btn{border:0;border-radius:10px;background:var(--orange);color:#fff;font-weight:800;font-size:16px;min-height:52px;padding:14px;cursor:pointer}.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--line);flex:0 0 110px}.btn.grow{flex:1}.btn:disabled{opacity:.55}
textarea{width:100%;min-height:150px;border:1.5px solid var(--line);border-radius:12px;padding:14px;font:inherit;font-size:16px}textarea:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px rgba(242,109,33,.12)}
.timer{font-weight:800;font-size:28px;margin:8px 0}.consent{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.4;margin:12px 0}.done{text-align:center;padding:28px 8px}.done p{color:var(--muted);line-height:1.55}
.err{color:#9a3412;font-size:14px;min-height:1.2em}
@media(max-width:600px){.hero h1{font-size:28px}.card{padding:18px}}
</style>
</head>
<body>
<header><div class="nav"><a href="/" class="brand"><span class="wm">cash<b>asis</b></span><span class="sub">WE BUY HOUSES AS-IS</span></a></div></header>
<section class="hero"><small>Application step 3</small><h1>Team & Position Assessment</h1><p id="hero-copy">One question at a time. Choose what is most natural for you. There are no perfect answers, and different positions benefit from different working styles.</p></section>
<div class="wrap"><div class="card" id="card"><p>Loading…</p></div></div>
<script>
const LIVE = /(^|\.)cashasis\.com$/.test(location.hostname);
const END = LIVE ? 'https://mzqzmnrmjdjzuxgrdzcd.supabase.co/functions/v1/careers-team-assessment-v2' : '';
const candidateId = sessionStorage.getItem('cashasis_candidate_id') || localStorage.getItem('cashasis_candidate_id') || '';
const position = sessionStorage.getItem('cashasis_candidate_position') || localStorage.getItem('cashasis_candidate_position') || 'Acquisitions';
if (candidateId) sessionStorage.setItem('cashasis_candidate_id', candidateId);

const card = document.getElementById('card');
const draftKey = 'cashasis_assessment_draft_v3:' + (candidateId || 'preview');
let bank, sequence = [], step = 0, picks = {}, work = { text: '', pasted: false }, audio = null, startedAt = Date.now(), phase = 'most';

function shuffle(list) {
  const copy = list.slice();
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const hold = copy[i];
    copy[i] = copy[j];
    copy[j] = hold;
  }
  return copy;
}
function lookup(key) {
  if (key === bank.attention.key) return { kind: 'scale', prompt: bank.attention.text, scale: bank.attention.scale };
  const check = bank.checks.find(item => item.key === key);
  if (check) return { kind: 'scale', prompt: check.text, scale: bank.attention.scale };
  const forced = bank.forced.find(item => item.key === key);
  if (forced) return { kind: 'forced', options: forced.options };
  const scenario = [...bank.scenarios, ...Object.values(bank.roles).flat()].find(item => item.key === key);
  if (scenario) return { kind: 'choice', prompt: scenario.prompt, options: scenario.options };
  return null;
}
function freshSequence() {
  const roleItems = bank.roles[position] || bank.roles.Acquisitions;
  const checks = shuffle(bank.checks);
  const spot = Math.floor(Math.random() * (checks.length + 1));
  const scale = [];
  checks.forEach((item, index) => {
    if (index === spot) scale.push({ kind: 'scale', key: bank.attention.key });
    scale.push({ kind: 'scale', key: item.key });
  });
  if (spot === checks.length) scale.push({ kind: 'scale', key: bank.attention.key });
  const items = [
    ...shuffle(bank.forced).map(item => ({ kind: 'forced', key: item.key, optionIds: shuffle(item.options).map(opt => opt.id) })),
    ...shuffle(bank.scenarios).map(item => ({ kind: 'choice', key: item.key, optionIds: shuffle(item.options).map(opt => opt.id) })),
    ...shuffle(roleItems).map(item => ({ kind: 'choice', key: item.key, optionIds: shuffle(item.options).map(opt => opt.id) })),
    ...scale
  ];
  if (position === 'Acquisitions') items.push({ kind: 'work' }, { kind: 'voice' });
  return items;
}
function materialize(saved) {
  return saved.map(entry => {
    if (entry.kind === 'work') return { kind: 'work', prompt: bank.work_sample_prompt };
    if (entry.kind === 'voice') return { kind: 'voice', prompt: bank.voice_prompt };
    const source = lookup(entry.key);
    if (!source) return null;
    const options = (entry.optionIds || source.options && source.options.map(opt => opt.id) || []).map(id => (source.options || []).find(opt => opt.id === id)).filter(Boolean);
    return { kind: source.kind, key: entry.key, prompt: source.prompt, options: options.length ? options : source.options, scale: source.scale };
  }).filter(Boolean);
}
function saveDraft() {
  localStorage.setItem(draftKey, JSON.stringify({
    step, picks, work, startedAt, phase,
    sequence: sequence.map(item => ({ kind: item.kind, key: item.key || null, optionIds: (item.options || []).map(opt => opt.id) }))
  }));
}
function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}
function button(label, className, attrs) {
  return '<button type="button" class="' + className + '" ' + attrs + '>' + esc(label) + '</button>';
}

function render() {
  const item = sequence[step];
  const last = step === sequence.length - 1;
  const note = position === 'Acquisitions'
    ? 'No real estate experience is needed. Answer for how you normally work.'
    : 'Answer for how you normally work. Different positions benefit from different styles.';
  let body = '';
  let title = '';
  let hint = '';
  if (item.kind === 'forced') {
    const pick = picks[item.key] || {};
    phase = pick.most && !pick.least ? 'least' : (pick.most && pick.least ? phase : 'most');
    if (!pick.most) phase = 'most';
    if (phase === 'least' && pick.most) {
      const chosen = item.options.find(opt => opt.id === pick.most);
      title = 'Which statement is least like you?';
      hint = 'You already chose this as most like you: ' + (chosen ? chosen.text : '');
      body = item.options.filter(opt => opt.id !== pick.most).map(opt => button(opt.text, 'choice' + (pick.least === opt.id ? ' on' : ''), 'data-least="' + opt.id + '"')).join('');
    } else {
      title = 'Which statement is most like you?';
      hint = 'Tap one. You will choose the least like you next.';
      body = item.options.map(opt => button(opt.text, 'choice' + (pick.most === opt.id ? ' on' : ''), 'data-most="' + opt.id + '"')).join('');
    }
  } else if (item.kind === 'choice') {
    const pick = picks[item.key] || {};
    title = item.prompt;
    hint = 'Tap the response that fits you best.';
    body = item.options.map(opt => button(opt.text, 'choice' + (pick.choice === opt.id ? ' on' : ''), 'data-choice="' + opt.id + '"')).join('');
  } else if (item.kind === 'scale') {
    const pick = picks[item.key] || {};
    title = item.prompt;
    hint = item.key === bank.attention.key ? 'Follow the instruction above.' : 'How true is this for you?';
    body = '<div class="opts">' + item.scale.map((label, index) => button(label, 'choice' + (pick.value === index + 1 ? ' on' : ''), 'data-value="' + (index + 1) + '"')).join('') + '</div>';
  } else if (item.kind === 'work') {
    title = item.prompt;
    hint = 'A couple of sentences is enough. You can write the reply, or describe how you would handle it.';
    body = '<textarea id="work-text">' + esc(work.text) + '</textarea>';
  } else {
    title = item.prompt;
    hint = 'You can skip this. Recordings stay private and are only used for hiring.';
    body = '<div class="timer" id="timer">' + (audio ? 'Recorded' : '0:00') + '</div><button type="button" class="btn" id="record">' + (audio ? 'Record again' : 'Record') + '</button> <label class="btn ghost" style="display:inline-flex;align-items:center;justify-content:center">Upload<input id="file" type="file" accept="audio/*" capture hidden></label><label class="consent"><input id="audio-consent" type="checkbox"' + (audio && audio.consent ? ' checked' : '') + '> I agree to store this recording privately for hiring review.</label>';
  }
  const continueLabel = last ? 'Submit assessment' : 'Continue';
  const showContinue = item.kind === 'work' || item.kind === 'voice' || answered(item);
  card.innerHTML = '<div class="progress">Question ' + (step + 1) + ' of ' + sequence.length + ' · Team & Position Assessment</div><div class="track"><span style="width:' + Math.round(((step + 1) / sequence.length) * 100) + '%"></span></div><div class="note">' + esc(note) + '</div><h2>' + esc(title) + '</h2><p class="hint">' + esc(hint) + '</p>' + body + '<p class="err" id="err"></p><div class="nav"><button type="button" class="btn ghost" id="back"' + (step === 0 ? ' disabled' : '') + '>Back</button>' + (showContinue ? '<button type="button" class="btn grow" id="forward">' + continueLabel + '</button>' : '') + '</div>';
  const back = document.getElementById('back');
  back.onclick = () => { if (step > 0) { step -= 1; phase = 'most'; saveDraft(); render(); } };
  const forward = document.getElementById('forward');
  if (forward) forward.onclick = () => goForward();
  card.querySelectorAll('[data-most]').forEach(el => el.onclick = () => chooseMost(el.getAttribute('data-most')));
  card.querySelectorAll('[data-least]').forEach(el => el.onclick = () => chooseLeast(el.getAttribute('data-least')));
  card.querySelectorAll('[data-choice]').forEach(el => el.onclick = () => chooseOne(el.getAttribute('data-choice')));
  card.querySelectorAll('[data-value]').forEach(el => el.onclick = () => chooseScale(Number(el.getAttribute('data-value'))));
  const workText = document.getElementById('work-text');
  if (workText) {
    workText.addEventListener('input', () => { work.text = workText.value; saveDraft(); });
    workText.addEventListener('paste', () => { work.pasted = true; saveDraft(); });
  }
  const record = document.getElementById('record');
  if (record) record.onclick = () => toggleRecord();
  const file = document.getElementById('file');
  if (file) file.onchange = () => readAudioFile(file.files && file.files[0]);
  const consent = document.getElementById('audio-consent');
  if (consent) consent.onchange = () => { if (audio) audio.consent = consent.checked; };
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function answered(item) {
  const pick = picks[item.key] || {};
  if (item.kind === 'forced') return Boolean(pick.most && pick.least);
  if (item.kind === 'choice') return Boolean(pick.choice);
  if (item.kind === 'scale') return Boolean(pick.value);
  return false;
}
function chooseMost(id) {
  picks[sequence[step].key] = { most: id };
  phase = 'least';
  saveDraft();
  render();
}
function chooseLeast(id) {
  const key = sequence[step].key;
  picks[key].least = id;
  saveDraft();
  advance();
}
function chooseOne(id) {
  picks[sequence[step].key] = { choice: id };
  saveDraft();
  advance();
}
function chooseScale(value) {
  picks[sequence[step].key] = { value };
  saveDraft();
  advance();
}
function goForward() {
  const item = sequence[step];
  const err = document.getElementById('err');
  if (item.kind === 'work') {
    work.text = document.getElementById('work-text').value.trim();
    if (work.text.length < 20) { err.textContent = "Please write what you'd say back, or how you'd handle this response."; return; }
    saveDraft();
    advance();
    return;
  }
  if (item.kind === 'voice') {
    const consent = document.getElementById('audio-consent');
    if (audio && consent && !consent.checked) { err.textContent = 'Check the box to save the recording, or record nothing and submit.'; return; }
    if (audio && consent) audio.consent = consent.checked;
    submit();
    return;
  }
  if (!answered(item)) { err.textContent = 'Please answer this question.'; return; }
  if (step === sequence.length - 1) submit();
  else advance();
}
function advance() {
  if (step < sequence.length - 1) { step += 1; phase = 'most'; saveDraft(); render(); }
  else submit();
}

let recorder = null, chunks = [], recordTimer = null, recordStarted = 0, recordStream = null;
function stopStream() {
  if (recordStream) recordStream.getTracks().forEach(track => track.stop());
  recordStream = null;
}
async function toggleRecord() {
  if (recorder && recorder.state === 'recording') { recorder.stop(); return; }
  if (!navigator.mediaDevices || typeof MediaRecorder === 'undefined') {
    document.getElementById('file').click();
    return;
  }
  try {
    recordStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const types = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'];
    const mime = types.find(type => MediaRecorder.isTypeSupported(type)) || '';
    chunks = [];
    recorder = new MediaRecorder(recordStream, mime ? { mimeType: mime } : undefined);
    recorder.ondataavailable = (event) => { if (event.data.size) chunks.push(event.data); };
    recorder.onstop = () => {
      clearInterval(recordTimer);
      stopStream();
      const blob = new Blob(chunks, { type: recorder.mimeType || 'audio/webm' });
      const duration = Date.now() - recordStarted;
      blobToAudio(blob, duration);
    };
    recordStarted = Date.now();
    recorder.start();
    recordTimer = setInterval(() => {
      const elapsed = Date.now() - recordStarted;
      const timer = document.getElementById('timer');
      if (timer) timer.textContent = '0:' + String(Math.min(60, Math.round(elapsed / 1000))).padStart(2, '0');
      if (elapsed >= 60000) recorder.stop();
    }, 250);
    const button = document.getElementById('record');
    if (button) button.textContent = 'Stop';
  } catch (err) {
    const file = document.getElementById('file');
    if (file) file.click();
  }
}
function readAudioFile(file) {
  if (!file) return;
  const probe = document.createElement('audio');
  probe.preload = 'metadata';
  probe.src = URL.createObjectURL(file);
  probe.onloadedmetadata = () => {
    const duration = Number.isFinite(probe.duration) ? Math.round(probe.duration * 1000) : 0;
    URL.revokeObjectURL(probe.src);
    if (duration > 65000) { document.getElementById('err').textContent = 'Please keep the recording to 60 seconds.'; return; }
    blobToAudio(file, duration);
  };
}
function blobToAudio(blob, duration) {
  const reader = new FileReader();
  reader.onload = () => {
    audio = { dataUrl: reader.result, filename: 'intro', durationMs: duration, consent: false };
    saveDraft();
    render();
  };
  reader.readAsDataURL(blob);
}

function payload() {
  const answers = [];
  sequence.forEach(item => {
    const pick = picks[item.key] || {};
    if (item.kind === 'forced') answers.push({ key: item.key, most: pick.most, least: pick.least });
    if (item.kind === 'choice') answers.push({ key: item.key, choice: pick.choice });
    if (item.kind === 'scale') answers.push({ key: item.key, value: pick.value });
  });
  const body = { candidate_id: candidateId, answers, client_elapsed_ms: Date.now() - startedAt };
  if (position === 'Acquisitions') body.work_sample = { text: work.text, pasted: work.pasted };
  if (audio && audio.consent) body.audio = { data_url: audio.dataUrl, filename: 'intro', duration_ms: audio.durationMs, consent: true };
  return body;
}
async function submit() {
  if (position === 'Acquisitions' && work.text.trim().length < 20) { step = sequence.findIndex(item => item.kind === 'work'); render(); document.getElementById('err').textContent = "Please write what you'd say back, or how you'd handle this response."; return; }
  const forward = document.getElementById('forward');
  if (forward) { forward.disabled = true; forward.textContent = 'Saving…'; }
  try {
    if (!candidateId && LIVE) throw new Error('Please start from the careers application.');
    if (LIVE) {
      const res = await fetch(END, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload()) });
      const data = await res.json();
      if (!res.ok || !data.ok) throw new Error(data.error || 'Unable to save');
    }
    localStorage.removeItem(draftKey);
    card.innerHTML = '<div class="done"><div class="progress">Application complete</div><h2>Application Complete</h2><p>Thanks for completing the Team & Position Assessment. If we would like to move forward, our team will contact you about next steps.</p></div>';
  } catch (err) {
    const message = document.getElementById('err');
    if (message) message.textContent = err.message || 'Please try again.';
    if (forward) { forward.disabled = false; forward.textContent = 'Submit assessment'; }
  }
}
async function pingStart() {
  if (!LIVE || !candidateId) return;
  try {
    await fetch(END, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'start', candidate_id: candidateId }) });
  } catch (err) {}
}

if (!candidateId && LIVE) {
  card.innerHTML = '<div class="done"><h2>Application session not found</h2><p>Please start from the CashAsIs careers application so we can connect this assessment to your application.</p><p><a href="/careers/">Return to Careers</a></p></div>';
} else {
  fetch('bank.json', { cache: 'no-cache' }).then(res => res.json()).then(data => {
    bank = data;
    if (position === 'Acquisitions') document.getElementById('hero-copy').textContent = 'One question at a time. No real estate experience is needed. Choose what is most natural for you.';
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(draftKey) || 'null'); } catch (err) {}
    if (saved && Array.isArray(saved.sequence)) {
      sequence = materialize(saved.sequence);
      if (sequence.length) {
        step = Math.min(saved.step || 0, sequence.length - 1);
        picks = saved.picks || {};
        work = saved.work || work;
        startedAt = saved.startedAt || startedAt;
      }
    }
    if (!sequence.length) sequence = materialize(freshSequence());
    saveDraft();
    pingStart();
    render();
  }).catch(() => { card.innerHTML = '<p>We could not load the assessment. Please refresh the page.</p>'; });
}
</script>
</body>
</html>
